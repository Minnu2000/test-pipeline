name: C Build Release

on:
  workflow_dispatch:

jobs:
  mount-binaries:
    runs-on: ubuntu-latest

    steps:
      - name: Create mount point directories
        run: |
          mkdir -p test/bin test/usr-bin

      - name: Mount system binaries into test directory
        run: |
          set -e

          sudo mount --bind /bin test/bin
          sudo mount --bind /usr/bin test/usr-bin

          echo "Mounted /bin -> $(pwd)/test/bin"
          echo "Mounted /usr/bin -> $(pwd)/test/usr-bin"

      - name: Verify mounted binaries
        run: |
          set -e

          if [ -x test/bin/ls ] && [ -x test/usr-bin/env ]; then
            echo "SUCCESS: System binaries are mounted and executable."
            ls -ld test/bin test/usr-bin
          else
            echo "ERROR: Expected system binaries were not found."
            exit 1
          fi

      - name: Print result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "SUCCESS: Mount test completed successfully."
          else
            echo "ERROR: Mount test failed."
          fi

      - name: Unmount test directories
        if: always()
        run: |
          sudo umount test/bin || true
          sudo umount test/usr-bin || true
